# CI for hermes-workflows: the same gates the release integrator runs by hand,
# fanned out to bound PR wall clock (the serial pass measured 28.7-32.0 min;
# census: median case 1.1 s, top-25 cases = 54% of the wall — one lane, one tail).
#
# Topology: fan-out/fan-in. `gates-shard` runs 8 matrix lanes, each executing
# `suite.py --shard I/8` — serial-within-lane, the SAME sorted case list, split
# disjoint by position. The `gates` join job fuses the shard ledgers with
# `suite.py --merge`, which re-demands the full contract: every lane present,
# marker-complete, non-empty, rows disjoint (a crashed or empty lane is RED,
# never a green slice — #112 extended from the suite to its lanes). The check
# named `gates` is what the merge lane reads; shard lanes are informational.
#
# The cheap gates are uniform per lane (they cost seconds): ESM parse, scrub
# audit, `hermes plugins validate` against the pinned core. Concurrency cancels
# superseded pushes instead of queueing a second full pass.
#
# HERMES_PIN = the CI core pin, tag v0.22.0 (first release carrying the
# private-import lint, so tests/test_private_core_imports.py RUNS — 13/13
# allow-list rows exact — instead of skipping; law-7 re-derivation and full
# contract-surface probe: workflows run 20261026-122817 / est-i3pro). The
# measured requires_hermes runtime floor stays v2026.9.21 (first release whose
# quiet turn report carries HERMES_QUIET_TURN_REPORT_FILE; evidence in
# docs/catalog/pr-body.md). Bump deliberately; never track a branch.
#
# Order matters: the pinned core is installed BEFORE the suite because the suite
# asserts vocabulary parity against it (tests/test_validate_0923.py imports
# hermes_constants — the same import path the plugin uses at runtime).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  HERMES_PIN: e06df9c2eae6901f4c88f464e0ae6e753c0428b8   # v0.22.0
  SHARDS: 8

jobs:
  gates-shard:
    name: gates-shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout pinned hermes-agent
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout "$HERMES_PIN"

      - name: Install pinned hermes (editable)
        run: |
          pip install -e /tmp/hermes-agent
          hermes --version || true

      - name: Desktop half parses (ESM)
        run: cp desktop/plugin.js /tmp/plugin.check.mjs && node --check /tmp/plugin.check.mjs

      - name: Suite shard
        # Every case runs in exactly one lane; serial-within-lane is the gate's
        # law (suite.py header documents why matrix lanes are the ONLY
        # parallelism). Optional `--baseline <measured-ledger>` remains for
        # local diagnosis only — base reds never waive (suite.py).
        run: python3 scripts/suite.py . ci-out --shard ${{ matrix.shard }}/8

      - name: Upload suite ledger + per-test logs (this lane)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out-shard-${{ matrix.shard }}
          path: ci-out/

      - name: Scrub audit (private strings)
        run: python3 scripts/make_public.py /tmp/public-tree

      - name: Validate plugin against pinned hermes
        run: hermes plugins validate .

  gates:
    name: gates
    needs: gates-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download shard ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: ci-out-shard-*
          path: shards

      - name: Merge shard ledgers (full-contract fan-in)
        # Refuses: missing lane, incomplete done.json marker, empty ledger,
        # duplicate rows. Prints the serial-pass vocabulary (TOTAL/FAIL +
        # ADMISSION) and exits on the merged ledger's truth.
        run: |
          dirs=""
          for i in $(seq 0 $((SHARDS - 1))); do
            dirs="$dirs shards/ci-out-shard-$i"
          done
          python3 scripts/suite.py . ci-out --merge $dirs

      - name: Upload merged suite ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out
          path: ci-out/
