# CI for hermes-workflows: the same gates the release integrator runs by hand,
# fanned out to bound PR wall clock (the serial pass measured 28.7-32.0 min;
# census: median case 1.1 s, top-25 cases = 54% of the wall — one lane, one tail).
# Plus the CONTRIBUTING-documented gates wired up by the fork bootstrap (now run on
# every push/PR): pr_tag_audit — every `(open PR #NN)` doc tag still points at an
# OPEN PR; and tests/11-canary / 11-lane-supervisor / 11-golden-solo — the lane
# kill/resume trio + golden-solo byte compare.
#
# Topology: fan-out/fan-in. `gates-shard` runs 8 matrix lanes, each executing
# `suite.py --shard I/8` — serial-within-lane, the SAME sorted case list, split
# disjoint by position. The `gates` join job fuses the shard ledgers with
# `suite.py --merge`, which re-demands the full contract: every lane present,
# marker-complete, non-empty, rows disjoint (a crashed or empty lane is RED,
# never a green slice — #112 extended from the suite to its lanes). The check
# named `gates` is what the merge lane reads; shard lanes are informational.
#
# The cheap gates are uniform per lane (they cost seconds): ESM parse, scrub
# audit, `hermes plugins validate` against the pinned core. Concurrency cancels
# superseded pushes instead of queueing a second full pass.
#
# HERMES_PIN = the CI core pin, tag v0.22.6 (current stable; still carries the
# private-import lint first shipped in v0.22.0, so tests/test_private_core_imports.py
# RUNS — 15/15 allow-list rows exact — instead of skipping, and carries the
# on_session_delete observer orphan_watch adopted at db146e08 so CI exercises
# the contract we actually rely on. Re-pin probe 2026-11-03 (nightly pass):
# 6 of 7 contract files moved v0.22.5→v0.22.6; all 8 consumed backend symbols,
# all 20 SDK exports and all 5 hooks in use are proven present at the tag
# (test_upstream_hook_contract, test_private_core_imports, test_validate_0923
# re-run as this repin's `gates` — the suite authority at the new pin).
# v0.22.0 law-7 re-derivation: workflows run 20261026-122817 /
# est-i3pro). The measured requires_hermes runtime floor stays v2026.9.21
# (first release whose quiet turn report carries
# HERMES_QUIET_TURN_REPORT_FILE; evidence in docs/catalog/pr-body.md). Bump
# deliberately; never track a branch. Install note: the pinned core is
# installed with `uv pip install --system --override` (Pillow==13.0.0) at both
# points, mirroring core's own [tool.uv] override-dependencies — plain pip is
# blind to it, and v0.22.5's Pillow-13 bump collides with browser-harness
# 0.1.13's pillow==12.3.0 pin (ResolutionImpossible, est-xddra run 41441923619).
# Drop the mirror when browser-harness allows Pillow 13.
#
# Order matters: the pinned core is installed BEFORE the suite because the suite
# asserts vocabulary parity against it (tests/test_validate_0923.py imports
# hermes_constants — the same import path the plugin uses at runtime).
#
# Fork note: this file is the atbrace fork bootstrap (owner-approved first CI).
# The 'gates' job is the required check promote.sh consumes; the graph-AST job is
# named 'graph' (never 'gates') so it can never masquerade as the promote gate.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  HERMES_PIN: f0d94882e89ab8d4098b5bb2f166adfb9ee0a0ab   # v0.22.6 (peeled commit of tag v0.22.6)
  SHARDS: 8

jobs:
  gates-shard:
    name: gates-shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # core >= v0.22.0 gates ALL deps at python>=3.14; 3.12 installs a bare core and the dashboard/config-dependent suite arms go red (est-i3pro CI evidence, run 40455391852)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout pinned hermes-agent
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout "$HERMES_PIN"

      - name: Install pinned hermes (editable, uv override mirror)
        # Plain pip is blind to core's [tool.uv] override-dependencies: core
        # v0.22.6 needs Pillow==13.0.0 on py>=3.14 while browser-harness 0.1.13
        # pins pillow==12.3.0 -> ResolutionImpossible (est-xddra, run 41441923619).
        # Install with uv and mirror the single override; drop the mirror when
        # browser-harness allows Pillow 13.
        run: |
          python -m pip install -q uv
          printf 'Pillow==13.0.0\n' > /tmp/hermes-pin-overrides.txt
          uv pip install --system -e /tmp/hermes-agent --override /tmp/hermes-pin-overrides.txt
          hermes --version || true

      - name: Desktop half parses (ESM)
        run: cp desktop/plugin.js /tmp/plugin.check.mjs && node --check /tmp/plugin.check.mjs

      - name: Suite shard
        # Every case runs in exactly one lane; serial-within-lane is the gate's
        # law (suite.py header documents why matrix lanes are the ONLY
        # parallelism). Optional `--baseline <measured-ledger>` remains for
        # local diagnosis only — base reds never waive (suite.py).
        run: python3 scripts/suite.py . ci-out --shard ${{ matrix.shard }}/8

      - name: Upload suite ledger + per-test logs (this lane)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out-shard-${{ matrix.shard }}
          path: ci-out/

      - name: Scrub audit (private strings)
        run: python3 scripts/make_public.py /tmp/public-tree

      - name: Validate plugin against pinned hermes
        run: hermes plugins validate .

  gates:
    name: gates
    needs: gates-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # core >= v0.22.0 gates ALL deps at python>=3.14; 3.12 installs a bare core and the dashboard/config-dependent suite arms go red (est-i3pro CI evidence, run 40455391852)

      - name: Download shard ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: ci-out-shard-*
          path: shards

      - name: Merge shard ledgers (full-contract fan-in)
        # Refuses: missing lane, incomplete done.json marker, empty ledger,
        # duplicate rows. Prints the serial-pass vocabulary (TOTAL/FAIL +
        # ADMISSION) and exits on the merged ledger's truth.
        run: |
          dirs=""
          for i in $(seq 0 $((SHARDS - 1))); do
            dirs="$dirs shards/ci-out-shard-$i"
          done
          python3 scripts/suite.py . ci-out --merge $dirs

      - name: "PR-tag doc audit (CONTRIBUTING: stale open-PR tags block)"
        # The `(open PR #NN)` tags in README/CONTRIBUTING/CHANGELOG/references
        # name PRs in the PARENT repo (upstream numbering); resolving them
        # against the fork would fail closed on wrong numbers, so pin the repo.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_tag_audit.py --repo jacobhausler/hermes-workflows

      - name: Clone pinned core
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent /tmp/hermes-agent
          git -C /tmp/hermes-agent checkout "$HERMES_PIN"

      - name: Install pinned hermes (editable, uv override mirror)
        # Plain pip is blind to core's [tool.uv] override-dependencies: core
        # v0.22.6 needs Pillow==13.0.0 on py>=3.14 while browser-harness 0.1.13
        # pins pillow==12.3.0 -> ResolutionImpossible (est-xddra, run 41441923619).
        # Install with uv and mirror the single override; drop the mirror when
        # browser-harness allows Pillow 13.
        run: |
          python -m pip install -q uv
          printf 'Pillow==13.0.0\n' > /tmp/hermes-pin-overrides.txt
          uv pip install --system -e /tmp/hermes-agent --override /tmp/hermes-pin-overrides.txt
          hermes --version || true

      - name: Lane trio (canary + supervisor kill/resume, golden-solo compare)
        # CONTRIBUTING-documented gates that never ran in CI before this fork
        # bootstrap. Pre-landing local proof (python 3.12, pinned core):
        # canary 20/20, lane-supervisor 20/20, golden-solo EMPTY diff.
        run: |
          python3 tests/11-canary.py
          python3 tests/11-lane-supervisor.py
          python3 tests/11-golden-solo.py compare . tests/golden_solo/v1.0.15.json

      - name: Upload merged suite ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out
          path: ci-out/
